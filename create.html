<body class="bg-[#1F1B24] text-gray-100 h-[100dvh] flex flex-col overflow-hidden font-sans">

  <script>
    // Add global unlock listeners immediately
    document.addEventListener('click', () => MusicController.unlockAndPlay(), { once: true });
    document.addEventListener('touchstart', () => MusicController.unlockAndPlay(), { once: true });
  </script>

  <!-- Navbar -->
  <nav class="flex-none bg-[#1F1B24] border-b border-white/10 z-50 h-14 sm:h-16">
    <div class="w-full h-full px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
      <div class="flex justify-between items-center h-full">
        <a href="index.html" class="flex items-center gap-2.5 hover:opacity-90 transition text-gray-300 group" aria-label="Quay lại trang chủ">
          <img src="logo.svg" alt="ThiepOnline" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg shadow-sm">
          <div class="flex items-center gap-1.5">
            <i class="fas fa-chevron-left text-[10px] text-gray-400 group-hover:text-primary transition"></i>
            <span class="font-medium text-xs sm:text-sm hidden sm:inline text-gray-300">Trang chủ</span>
          </div>
        </a>

        <div
          class="font-serif font-bold text-base sm:text-xl text-center absolute left-1/2 transform -translate-x-1/2 tracking-wide text-white flex items-center gap-2">
          <span>Thiết Kế Thiệp</span>
        </div>

        <div>
          <button id="btn-save"
            class="bg-gradient-to-r from-primary to-rose-500 hover:from-primary/90 hover:to-rose-500/90 text-white px-4 sm:px-6 py-1.5 sm:py-2 rounded-full font-bold transition shadow-lg shadow-primary/20 flex items-center gap-2 text-xs sm:text-sm">
            <span>Hoàn Tất</span> <i class="fas fa-check"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- PREVIEW AREA (Responsive Order) -->
    <!-- Mobile: Top 45vh, Desktop: Right Side Flex-1 -->
    <div
      class="order-1 lg:order-2 w-full h-[45vh] lg:h-full lg:flex-1 bg-[#0F0D11] relative flex items-center justify-center p-4 lg:p-10 overflow-hidden border-b border-white/10 lg:border-b-0"
      id="preview-container">

      <!-- Background Decoration -->
      <div class="absolute inset-0 z-0 opacity-30 pointer-events-none" id="preview-bg-pattern">
        <div
          class="absolute top-0 left-0 w-96 h-96 bg-primary rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-float">
        </div>
        <div
          class="absolute bottom-0 right-0 w-96 h-96 bg-rose-600 rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-float"
          style="animation-delay: 2s"></div>
      </div>

      <!-- Card Container (Scaled for Mobile) -->
      <div
        class="relative z-10 w-full max-w-[280px] sm:max-w-sm lg:max-w-md aspect-[3/4] perspective-1000 h-full lg:h-auto flex items-center justify-center">
        <div id="card-preview"
          class="w-full h-auto aspect-[3/4] bg-white rounded-lg shadow-2xl relative overflow-hidden transform transition duration-500 border border-white/10 group flex flex-col">

          <!-- Image Layer -->
          <div id="card-image-wrapper" class="h-3/5 w-full relative overflow-hidden bg-gray-900 transition-all duration-500">
            <img id="card-image" src="" class="w-full h-full object-cover opacity-90 transition duration-700"
              alt="Xem trước">
            <div id="card-image-gradient" class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
          </div>

          <!-- Content Layer -->
          <div id="card-content-layer"
            class="h-2/5 p-4 sm:p-6 flex flex-col items-center justify-center text-center bg-white relative transition-colors duration-300">
            <h2 id="card-title"
              class="font-serif text-xl sm:text-2xl lg:text-3xl font-bold text-gray-900 mb-2 line-clamp-2 transition-colors duration-300">
              Tiêu đề</h2>
            <p id="card-message"
              class="font-hand text-xl sm:text-2xl lg:text-3xl text-gray-600 leading-relaxed overflow-hidden line-clamp-3 transition-colors duration-300">
              Lời nhắn của bạn...
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- CONTROLS SIDEBAR -->
    <!-- Mobile: Bottom Scrollable Flex-1, Desktop: Left Fixed Width -->
    <div
      class="order-2 lg:order-1 w-full lg:w-96 bg-[#18151D] border-r border-white/5 flex flex-col flex-1 lg:h-full z-20 shadow-2xl overflow-y-auto custom-scroll">
      <div class="p-6 space-y-6 sm:space-y-8 pb-20 lg:pb-6">

        <!-- Image Upload -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">1. Hình Ảnh</label>
          <div class="relative group">
            <label for="image-input"
              class="w-full h-24 sm:h-36 border border-dashed border-white/20 bg-white/5 rounded-xl flex flex-col items-center justify-center hover:border-primary/50 hover:bg-white/10 transition cursor-pointer"
              id="upload-trigger-label">
              <i class="fas fa-image text-2xl sm:text-3xl text-gray-500 group-hover:text-primary mb-2 transition"></i>
              <span class="text-xs sm:text-sm text-gray-400 group-hover:text-primary font-medium">Tải ảnh lên (Max
                5MB)</span>
            </label>
            <input type="file" id="image-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
              accept="image/jpeg,image/png,image/webp" aria-label="Chọn ảnh cho thiệp">
          </div>
          <button type="button" id="btn-reset-image"
            class="mt-2 hidden text-xs text-rose-400 hover:text-rose-300 items-center gap-1.5 transition font-medium">
            <i class="fas fa-undo-alt text-[10px]"></i> Dùng lại ảnh mặc định của mẫu
          </button>
        </div>

        <!-- Text Inputs -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">2. Lời Chúc</label>
          <div class="space-y-3 sm:space-y-4">
            <div>
              <input type="text" id="input-title" placeholder="Tiêu đề (VD: Happy Birthday)" maxlength="80"
                aria-describedby="title-counter"
                class="w-full px-4 py-2 sm:py-3 bg-[#2D2833] border border-white/10 rounded-lg text-white text-sm sm:text-base placeholder-gray-500 focus:outline-none focus:border-primary transition">
              <p id="title-counter" class="mt-1 text-right text-[11px] text-gray-500">0/80</p>
            </div>
            <div>
              <textarea id="input-message" rows="3" placeholder="Nhập lời chúc của bạn ở đây..." maxlength="600"
                aria-describedby="message-counter"
                class="w-full px-4 py-2 sm:py-3 bg-[#2D2833] border border-white/10 rounded-lg text-white text-sm sm:text-base placeholder-gray-500 focus:outline-none focus:border-primary transition resize-none"></textarea>
              <p id="message-counter" class="mt-1 text-right text-[11px] text-gray-500">0/600</p>
            </div>
          </div>
        </div>

        <!-- Font Selection -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Phông Chữ</label>
            <span id="current-font-name" class="text-xs text-primary font-medium">Dancing Script</span>
          </div>
          <div class="grid grid-cols-5 gap-2" id="font-selector">
            <!-- Buttons injected via JS -->
          </div>
        </div>

        <!-- Music Selection -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">3. Nhạc Nền</label>
          <div class="mb-3 relative">
            <input type="text" id="music-search" placeholder="Tìm kiếm bài hát (VD: Son Tung)..."
              class="w-full pl-3 pr-10 py-2 bg-[#2D2833] border border-white/10 rounded-lg text-white text-sm placeholder-gray-500 focus:outline-none focus:border-primary transition">
            <button id="btn-search-music" aria-label="Tìm nhạc"
              class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-primary">
              <i class="fas fa-search"></i>
            </button>
          </div>
          <div class="space-y-2 overflow-y-auto max-h-48 sm:max-h-60" id="music-list">
            <!-- Music items injected via JS -->
          </div>
          <p id="music-status" class="mt-2 hidden text-xs text-gray-400" role="status" aria-live="polite"></p>
        </div>

        <!-- Color Tint -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">4. Tông Màu</label>
          <div class="flex gap-3">
            <button aria-label="Tông màu hồng lãng mạn" title="Hồng Lãng Mạn"
              class="w-8 h-8 rounded-full bg-rose-400 ring-2 ring-offset-2 ring-offset-[#18151D] ring-transparent hover:ring-gray-600 focus:ring-primary transition color-btn"
              data-color="pink"></button>
            <button aria-label="Tông màu xanh thanh lịch" title="Xanh Thanh Lịch"
              class="w-8 h-8 rounded-full bg-sky-400 ring-2 ring-offset-2 ring-offset-[#18151D] ring-transparent hover:ring-gray-600 focus:ring-primary transition color-btn"
              data-color="blue"></button>
            <button aria-label="Tông màu vàng ấm áp" title="Vàng Ấm Áp"
              class="w-8 h-8 rounded-full bg-amber-300 ring-2 ring-offset-2 ring-offset-[#18151D] ring-transparent hover:ring-gray-600 focus:ring-primary transition color-btn"
              data-color="yellow"></button>
            <button aria-label="Tông màu đen sang trọng" title="Đen Sang Trọng"
              class="w-8 h-8 rounded-full bg-gray-800 ring-2 ring-offset-2 ring-offset-[#18151D] ring-transparent hover:ring-gray-600 focus:ring-primary transition color-btn"
              data-color="dark"></button>
          </div>
        </div>

        <!-- Layout Selection -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">5. Bố Cục Thiệp</label>
            <span id="current-layout-name" class="text-xs text-primary font-medium">Tiêu chuẩn</span>
          </div>
          <div class="grid grid-cols-4 gap-2" id="layout-selector">
            <button type="button" data-layout="split" aria-label="Bố cục tiêu chuẩn"
              class="layout-btn flex flex-col items-center justify-center p-2 rounded-lg border border-white/10 bg-[#2D2833] text-gray-300 hover:border-primary hover:text-white transition group focus:outline-none focus:ring-1 focus:ring-primary">
              <i class="fas fa-columns text-base mb-1 group-hover:scale-110 transition"></i>
              <span class="text-[10px] font-medium">Tiêu chuẩn</span>
            </button>
            <button type="button" data-layout="overlay" aria-label="Bố cục tràn viền"
              class="layout-btn flex flex-col items-center justify-center p-2 rounded-lg border border-white/10 bg-[#2D2833] text-gray-300 hover:border-primary hover:text-white transition group focus:outline-none focus:ring-1 focus:ring-primary">
              <i class="fas fa-expand text-base mb-1 group-hover:scale-110 transition"></i>
              <span class="text-[10px] font-medium">Tràn viền</span>
            </button>
            <button type="button" data-layout="polaroid" aria-label="Bố cục Polaroid"
              class="layout-btn flex flex-col items-center justify-center p-2 rounded-lg border border-white/10 bg-[#2D2833] text-gray-300 hover:border-primary hover:text-white transition group focus:outline-none focus:ring-1 focus:ring-primary">
              <i class="fas fa-camera-retro text-base mb-1 group-hover:scale-110 transition"></i>
              <span class="text-[10px] font-medium">Polaroid</span>
            </button>
            <button type="button" data-layout="letter" aria-label="Bố cục thư tay"
              class="layout-btn flex flex-col items-center justify-center p-2 rounded-lg border border-white/10 bg-[#2D2833] text-gray-300 hover:border-primary hover:text-white transition group focus:outline-none focus:ring-1 focus:ring-primary">
              <i class="fas fa-envelope-open-text text-base mb-1 group-hover:scale-110 transition"></i>
              <span class="text-[10px] font-medium">Thư tay</span>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Loading Overlay -->
  <div id="loading"
    class="fixed inset-0 bg-[#0F0D11]/90 backdrop-blur-sm z-[100] hidden items-center justify-center flex-col">
    <div class="w-12 h-12 border-2 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-white font-medium tracking-widest text-sm uppercase">Đang xuất bản...</p>
  </div>

  <!-- Custom Alert/Confirm Modal -->
  <div id="custom-dialog" class="fixed inset-0 z-[100] hidden items-center justify-center">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0 duration-300"
      id="dialog-backdrop"></div>

    <!-- Modal Content -->
    <div
      class="relative bg-[#2D2833] border border-white/10 rounded-2xl shadow-2xl p-6 sm:p-8 max-w-sm w-full mx-4 transform scale-95 opacity-0 transition-all duration-300 z-10"
      id="dialog-panel">
      <div class="text-center">
        <!-- Icon -->
        <div id="dialog-icon-container"
          class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-primary/10 mb-6 ring-1 ring-primary/30">
          <i id="dialog-icon" class="fas fa-info text-2xl text-primary"></i>
        </div>

        <h3 class="text-xl font-bold text-white mb-3 tracking-tight" id="dialog-title">Thông báo</h3>
        <p class="text-gray-400 mb-8 leading-relaxed font-light" id="dialog-message">Nội dung thông báo...</p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center" id="dialog-actions">
          <!-- Buttons injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
